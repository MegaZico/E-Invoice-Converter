<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Smart QR Generator & Reader</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/encoding-japanese@1.0.30/encoding.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  
  <style>
    /* ... (احتفظت بنفس التنسيقات الخاصة بك لضمان نفس الشكل) ... */
    :root { --primary: #2563eb; --primary-light: #3b82f6; --bg-page: #f8fafc; --bg-card: #ffffff; }
    body { font-family: sans-serif; background: var(--bg-page); padding: 20px; }
    .container { max-width: 800px; margin: auto; }
    .card { background: var(--bg-card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .preview-img { width: 300px; height: 300px; border: 1px solid #ddd; cursor: grab; }
    .btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>QR Generator</h2>
    <div class="generator">
      <button id="generateBtn" class="btn">Generate QR</button>
      
      <div style="margin-top:20px;">
        <img id="previewImg" class="preview-img" alt="QR preview" draggable="true" />
        <p><em>Try dragging the image above to your desktop!</em></p>
      </div>
    </div>
  </div>
</div>

<script>
  const previewImg = document.getElementById('previewImg');
  const generateBtn = document.getElementById('generateBtn');
  let currentBlobUrl = null;

  // 1. منطق التوليد (بسيط للتوضيح)
  generateBtn.addEventListener('click', async () => {
    // محاكاة توليد QR
    const qr = qrcode(0, 'M');
    qr.addData('https://google.com');
    qr.make();
    
    // إنشاء Canvas
    const canvas = document.createElement('canvas');
    canvas.width = 300;
    canvas.height = 300;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,300,300);
    ctx.fillStyle = '#000000';
    // رسم بسيط
    ctx.fillRect(50, 50, 200, 200); 

    // تحويل إلى Blob
    canvas.toBlob(blob => {
      if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
      currentBlobUrl = URL.createObjectURL(blob);
      previewImg.src = currentBlobUrl;
    }, 'image/png');
  });

  // 2. الحل الجذري للسحب والإفلات (Drag and Drop)
  previewImg.addEventListener('dragstart', (e) => {
    if (!currentBlobUrl) {
      e.preventDefault();
      return;
    }

    // السماح بنسخ الملف
    e.dataTransfer.effectAllowed = 'copy';

    /* السر هنا: 
       1. DownloadURL: هذا هو المفتاح لإخبار المتصفح أن هذا الرابط هو ملف.
       2. text/uri-list: للتوافق مع المتصفحات القديمة.
       3. الترتيب مهم جداً ليتم التعرف عليه كملف.
    */
    const fileName = "QRCode.png";
    const mimeType = "image/png";
    
    // التنسيق الصحيح: [MIME]:[NAME]:[URL]
    const downloadData = `${mimeType}:${fileName}:${currentBlobUrl}`;
    
    e.dataTransfer.setData('DownloadURL', downloadData);
    e.dataTransfer.setData('text/uri-list', currentBlobUrl);
    e.dataTransfer.setData('text/plain', currentBlobUrl);

    console.log("Drag started, Transfer data set to:", downloadData);
  });

  // إضافة معالج للإفلات (اختياري لضمان السلوك)
  previewImg.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });

</script>
</body>
</html>
